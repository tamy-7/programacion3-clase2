<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel AuraTerra - UTN</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background-color: #f8f9fa; }
        h1 { color: #333; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        input { padding: 8px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #dee2e6; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>Inventario AuraTerra</h1>

    <div class="form-container">
        <form id="form-producto">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="number" id="cantidad" placeholder="Cantidad" required>
            <input type="number" id="precio" placeholder="Precio" step="0.01">
            <button type="submit">Guardar</button>
        </form>
        <div id="mensajes"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre del Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Precio Total</th> <!-- Columna nueva -->
                <th>Última Actualización</th> <!-- Esta es la que agregamos -->
            </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>

    <script src="js/main.js"></script>
</body>
</html>
